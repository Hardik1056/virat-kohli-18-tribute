name: Deploy 18 One Last Chapter to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Node dependencies & build CSS
        run: |
          npm ci || npm install
          npm run build

      - name: 🛡️ Run Pre-flight Deployment & Security Audit
        run: |
          npm run check

      - name: 🚀 Deploy to Oracle Cloud VM via SSH Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.ORACLE_HOST }}
          REMOTE_USER: ${{ secrets.ORACLE_USER }}
          TARGET: /var/www/virat-kohli
          EXCLUDE: '/.git/, /scripts/, /scratch/, /node_modules/'
          SCRIPT_AFTER: |
            sudo nginx -t && sudo systemctl reload nginx || sudo systemctl restart nginx
