[build]
  publish = "."
  command = "npm run build"

# Root landing redirect
[[redirects]]
  from = "/"
  to = "/18_one_last_chapter_hero/code.html"
  status = 200

# Canonical Pretty URLs
[[redirects]]
  from = "/stats"
  to = "/18_career_stats_international/code.html"
  status = 200

[[redirects]]
  from = "/editorial"
  to = "/18_the_last_chapter_desktop_editorial/code.html"
  status = 200

[[redirects]]
  from = "/journey"
  to = "/18_the_journey_horizontal_documentary_timeline/code.html"
  status = 200

[[redirects]]
  from = "/innings"
  to = "/18_the_innings_we_ll_never_forget_desktop/code.html"
  status = 200

[[redirects]]
  from = "/remaining-odis"
  to = "/18_the_last_ones_remaining_odis/code.html"
  status = 200

[[redirects]]
  from = "/world-cup-2027"
  to = "/18_world_cup_2027_destination/code.html"
  status = 200

[[redirects]]
  from = "/82-melbourne"
  to = "/18_82_vs_pakistan_melbourne_2022/code.html"
  status = 200

[[redirects]]
  from = "/match-details"
  to = "/18_match_details_india_vs_australia/code.html"
  status = 200

[[redirects]]
  from = "/be-there"
  to = "/18_be_there_for_it_desktop/code.html"
  status = 200

[[redirects]]
  from = "/we-were-there"
  to = "/18_we_were_there_fan_memories_keepsake/code.html"
  status = 200

[[redirects]]
  from = "/keepsake"
  to = "/18_i_was_there_commemorative_keepsake_generator/code.html"
  status = 200

# Cache-Control headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
