name: Deploy 18 One Last Chapter to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Node dependencies & build CSS
        run: |
          npm ci || npm install
          npm run build

      - name: 🛡️ Run Pre-flight Deployment & Security Audit
        run: |
          npm run check

      - name: 🗂️ Setup Clean URLs for GitHub Pages
        run: |
          # Clean-URL routes are derived from vercel.json instead of being
          # hand-listed. A hand-written list silently falls behind the site:
          # /quiz and /trivia were both absent here while Vercel served them
          # fine, so the mirror 404'd on two of the site's twelve routes.
          python3 - <<'PY'
          import json, os, shutil

          with open('vercel.json', encoding='utf-8') as handle:
              config = json.load(handle)

          routes = {}
          for rule in config.get('rewrites', []):
              source = rule['source'].split('?')[0]
              destination = rule['destination']
              # Clean-URL aliases only: a slashless public path pointing at a
              # page folder. The /18_* and /18_*/code paths need no folder here
              # because the whole repo is uploaded as the Pages artifact.
              if source == '/' or source.startswith('/18_') or not destination.endswith('/code.html'):
                  continue
              routes[source.strip('/')] = destination

          for route, destination in sorted(routes.items()):
              os.makedirs(route, exist_ok=True)
              shutil.copyfile('.' + destination, os.path.join(route, 'index.html'))

          print('Published %d clean URLs: %s' % (len(routes), ', '.join('/' + r for r in sorted(routes))))
          PY

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
