name: Deploy 18 One Last Chapter to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python for audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Node dependencies & build CSS
        run: |
          npm ci || npm install
          npm run build

      - name: 🛡️ Run Pre-flight Deployment & Security Audit
        run: |
          npm run check

      - name: 🗂️ Setup Clean URLs for GitHub Pages
        run: |
          mkdir -p stats journey innings remaining-odis world-cup-2027 82-melbourne match-details be-there editorial
          cp 18_career_stats_international/code.html stats/index.html
          cp 18_the_journey_horizontal_documentary_timeline/code.html journey/index.html
          cp 18_the_innings_we_ll_never_forget_desktop/code.html innings/index.html
          cp 18_the_last_ones_remaining_odis/code.html remaining-odis/index.html
          cp 18_world_cup_2027_destination/code.html world-cup-2027/index.html
          cp 18_82_vs_pakistan_melbourne_2022/code.html 82-melbourne/index.html
          cp 18_match_details_india_vs_australia/code.html match-details/index.html
          cp 18_be_there_for_it_desktop/code.html be-there/index.html
          cp 18_the_last_chapter_desktop_editorial/code.html editorial/index.html

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
