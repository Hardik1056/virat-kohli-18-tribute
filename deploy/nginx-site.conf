# HTTP Server Block: ACME Challenge & Permanent Redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name thelastdance18.online www.thelastdance18.online 130.210.63.202;

    # ACME Challenge for Automated SSL Renewal
    location /.well-known/acme-challenge/ {
        root /var/www/virat-kohli;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://thelastdance18.online$request_uri;
    }
}

# HTTPS Server Block: Modern TLS, Security Headers, Clean URL Routing
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name thelastdance18.online www.thelastdance18.online;

    root /var/www/virat-kohli;
    index index.html code.html;

    # SSL / TLS Configuration
    ssl_certificate /etc/ssl/thelastdance18/fullchain.pem;
    ssl_certificate_key /etc/ssl/thelastdance18/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Enterprise HTTP Security Headers (A+ Security Grade)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob: https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Root redirect
    location = / {
        try_files /18_one_last_chapter_hero/code.html =404;
    }

    # Canonical Clean URL Rewrites
    location = /stats {
        try_files /18_career_stats_international/code.html =404;
    }
    location = /editorial {
        try_files /18_the_last_chapter_desktop_editorial/code.html =404;
    }
    location = /journey {
        try_files /18_the_journey_horizontal_documentary_timeline/code.html =404;
    }
    location = /innings {
        try_files /18_the_innings_we_ll_never_forget_desktop/code.html =404;
    }
    location = /remaining-odis {
        try_files /18_the_last_ones_remaining_odis/code.html =404;
    }
    location = /world-cup-2027 {
        try_files /18_world_cup_2027_destination/code.html =404;
    }
    location = /82-melbourne {
        try_files /18_82_vs_pakistan_melbourne_2022/code.html =404;
    }
    location = /match-details {
        try_files /18_match_details_india_vs_australia/code.html =404;
    }
    location = /be-there {
        try_files /18_be_there_for_it_desktop/code.html =404;
    }
    location = /we-were-there {
        try_files /18_we_were_there_fan_memories_keepsake/code.html =404;
    }
    location = /keepsake {
        try_files /18_i_was_there_commemorative_keepsake_generator/code.html =404;
    }

    # Static Assets with 1-Year Immutable Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shared CSS/JS with Stale-While-Revalidate
    location /shared/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # Standard Static File Fallback
    location / {
        try_files $uri $uri/ =404;
    }
}
